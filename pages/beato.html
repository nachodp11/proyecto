    <h1> SU legado y canonización</h1>
    <h2>Su legado</h2>
    <p>El legado del Beato Juan Agramunt sigue inspirando a muchos fieles,recordándonos la importancia de la perseverancia en la fe.Su vida es un testimonio de amor y dedicación a Dios,incluso en las situaciones más adversas</p>
    <br>
    <h2>Su celebración y canonización</h2>
    <p>Su muerte en 1936 en Almazora durante la persecución religiosa de la Guerra Civil lo convierte en un mártir.El Beato Juan Agramunt Riera fue reconocido por la Iglesia Católica como mártir durante la Guerra Civil.Su canonización fue decretada por Juan Pablo II el 1 de octubre de 1995,reconociendo su sacrificio y valentía en el contexto del sufrimiento de la Iglesia durante el conflicto bélico.</p>
